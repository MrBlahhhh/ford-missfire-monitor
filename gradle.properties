org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon. The separate Kotlin daemon writes its
# lock file to java.io.tmpdir, which resolved to C:\Windows (access denied) when
# Gradle was started from the agent's shell. In-process is plenty for this size.
kotlin.compiler.execution.strategy=in-process
